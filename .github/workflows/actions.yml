name: Compile

on:
  push:
    branch: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurem Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Instalem paquets
        run: pip install pyinstaller

      - name: Empaquetem
        run: pyinstaller --onefile comprova_desplegaments.py

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurem Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Instalem paquets
        run: pip install pyinstaller

      - name: Empaquetem
        run: pyinstaller --onefile comprova_desplegaments.py

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurem Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Instalem paquets
        run: pip install pyinstaller

      - name: Empaquetem
        run: pyinstaller --onefile comprova_desplegaments.py
